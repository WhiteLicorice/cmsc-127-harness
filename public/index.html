<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CMSC 127 Harness</title>
    <script>
      (() => {
        const key = "cmsc127-theme";
        const themes = [
          "upv-light", "upv-dark", "github-light", "github-dark", "one-dark", "nord",
          "solarized-light", "solarized-dark", "catppuccin-latte", "catppuccin-mocha",
          "tokyo-night", "gruvbox-light", "gruvbox-dark",
        ];
        const root = document.documentElement;
        let stored = null;
        try {
          stored = localStorage.getItem(key);
        } catch {
          stored = null;
        }
        const system = window.matchMedia("(prefers-color-scheme: dark)").matches ? "upv-dark" : "upv-light";
        const theme = stored !== null && themes.includes(stored) ? stored : system;
        root.dataset.theme = theme;
        document.addEventListener("DOMContentLoaded", () => {
          const select = document.getElementById("theme-select");
          if (!(select instanceof HTMLSelectElement)) {
            return;
          }
          select.value = theme;
          select.addEventListener("change", () => {
            root.dataset.theme = select.value;
            document.dispatchEvent(new CustomEvent("cmsc127:theme", { detail: select.value }));
            try {
              localStorage.setItem(key, select.value);
            } catch {
              return;
            }
          });
        });
      })();
    </script>
    <link rel="stylesheet" href="style.css">
    <script defer src="vendor/mermaid.min.js"></script>
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <header class="page-header">
      <div class="page-brand">
        <h1>CMSC 127 Harness</h1>
        <a class="byline" href="https://github.com/WhiteLicorice/cmsc-127-harness" target="_blank" rel="noopener noreferrer" aria-label="WhiteLicorice on GitHub"><svg class="byline-mark" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg><span>by WhiteLicorice</span></a>
      </div>
      <div class="page-controls">
        <label for="theme-select">Theme</label>
        <select id="theme-select" class="header-select">
          <optgroup label="UP">
            <option value="upv-light">UPV Light</option>
            <option value="upv-dark">UPV Dark</option>
          </optgroup>
          <optgroup label="GitHub">
            <option value="github-light">GitHub Light</option>
            <option value="github-dark">GitHub Dark</option>
          </optgroup>
          <optgroup label="Community">
            <option value="one-dark">One Dark</option>
            <option value="nord">Nord</option>
            <option value="solarized-light">Solarized Light</option>
            <option value="solarized-dark">Solarized Dark</option>
            <option value="catppuccin-latte">Catppuccin Latte</option>
            <option value="catppuccin-mocha">Catppuccin Mocha</option>
            <option value="tokyo-night">Tokyo Night</option>
            <option value="gruvbox-light">Gruvbox Light</option>
            <option value="gruvbox-dark">Gruvbox Dark</option>
          </optgroup>
        </select>
        <label for="schema-select">Schema</label>
        <select id="schema-select" class="header-select" disabled></select>
      </div>
    </header>
    <main>
      <p id="connection-message" class="connection-message" role="status" hidden></p>
      <p id="poll-summary" class="poll-summary">Waiting for the first poll.</p>
      <nav id="panels" class="panel-tabs" aria-label="Harness panels"></nav>
      <section id="panel-content" class="panel-content" aria-live="polite">
        <p>Loading the page.</p>
      </section>
    </main>
  </body>
</html>
