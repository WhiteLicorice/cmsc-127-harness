name: Harness Page

on:
  push:
    branches: [main, t*]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55445:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CMSC127_DATABASE_URL: postgresql://postgres@127.0.0.1:55445/postgres
      PGHOST: 127.0.0.1
      PGPORT: 55445
      PGUSER: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: 3.15.2
      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
          npm ci
      - name: Check Python types
        run: npm exec -- pyright
      - name: Test and build
        run: |
          npm run typecheck
          npm test -- --reporter=verbose
          npm run build
      - name: Install Chromium for headless smoke
        run: npx playwright install chromium --with-deps --only-shell
      - name: Run headless browser smoke
        run: npm run smoke:browser
      - name: Create the pair-only database
        shell: bash
        run: |
          pair_url="${CMSC127_DATABASE_URL%/*}/t12_pair"
          psql "$CMSC127_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -c "DROP DATABASE IF EXISTS t12_pair WITH (FORCE);" \
            -c "CREATE DATABASE t12_pair;"
          psql "$pair_url" -v ON_ERROR_STOP=1 \
            -c "DROP SCHEMA public CASCADE;" \
            -c "CREATE SCHEMA pair;" \
            -c "CREATE TABLE pair.student (id integer PRIMARY KEY, name text NOT NULL);" \
            -c "INSERT INTO pair.student VALUES (1, 'Ana'), (2, 'Ben');"
          echo "CMSC127_PAIR_DATABASE_URL=$pair_url" >> "$GITHUB_ENV"
      - name: Run the pair-only schema startup smoke
        run: npm run smoke:schema
      - name: Upload browser smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: harness-page-smoke-${{ runner.os }}-${{ github.run_id }}
          path: smoke-artifacts/
          if-no-files-found: warn
      - name: Run all Python tests
        run: .venv/bin/python -m unittest discover --start-directory tests --top-level-directory . --verbose

  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CMSC127_DATABASE_URL: postgresql://postgres@127.0.0.1:55445/postgres
      PGHOST: 127.0.0.1
      PGPORT: 55445
      PGUSER: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: 3.15.2
      - name: Find PostgreSQL tools on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pgBin = $env:PGBIN
          if (-not $pgBin -or -not (Test-Path (Join-Path $pgBin 'initdb.exe'))) {
            $install = Get-ChildItem 'C:\Program Files\PostgreSQL' -Directory |
              Sort-Object Name -Descending |
              Select-Object -First 1
            if ($install) {
              $pgBin = Join-Path $install.FullName 'bin'
            }
          }
          if (-not $pgBin -or -not (Test-Path (Join-Path $pgBin 'initdb.exe'))) {
            $initdb = Get-Command initdb.exe -ErrorAction Stop
            $pgBin = Split-Path $initdb.Source
          }
          "PG_BIN=$pgBin" >> $env:GITHUB_ENV
          $pgBin >> $env:GITHUB_PATH
      - name: Install PostgreSQL on macOS
        if: runner.os == 'macOS'
        run: |
          brew install postgresql@18
          echo "$(brew --prefix postgresql@18)/bin" >> "$GITHUB_PATH"
      - name: Start PostgreSQL on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP 't12-pg'
          & "$env:PG_BIN\initdb.exe" -D $data -U postgres -A trust
          & "$env:PG_BIN\pg_ctl.exe" -D $data -l (Join-Path $env:RUNNER_TEMP 't12-pg.log') -o '-h 127.0.0.1 -p 55445' -w start
      - name: Start PostgreSQL on macOS
        if: runner.os == 'macOS'
        run: |
          initdb -D "$RUNNER_TEMP/t12-pg" -U postgres -A trust
          pg_ctl -D "$RUNNER_TEMP/t12-pg" -l "$RUNNER_TEMP/t12-pg.log" -o '-h 127.0.0.1 -p 55445' -w start
      - name: Install Python and Node dependencies on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt
          npm ci
      - name: Install Python and Node dependencies on macOS
        if: runner.os == 'macOS'
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
          npm ci
      - name: Check Python types
        run: npm exec -- pyright
      - name: Test and build
        run: |
          npm run typecheck
          npm test -- --reporter=verbose
          npm run build
      - name: Install Chromium for headless smoke on macOS and Windows
        if: runner.os != 'Linux'
        run: npx playwright install chromium --only-shell
      - name: Run headless browser smoke
        run: npm run smoke:browser
      - name: Create the pair-only database
        shell: bash
        run: |
          pair_url="${CMSC127_DATABASE_URL%/*}/t12_pair"
          psql "$CMSC127_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -c "DROP DATABASE IF EXISTS t12_pair WITH (FORCE);" \
            -c "CREATE DATABASE t12_pair;"
          psql "$pair_url" -v ON_ERROR_STOP=1 \
            -c "DROP SCHEMA public CASCADE;" \
            -c "CREATE SCHEMA pair;" \
            -c "CREATE TABLE pair.student (id integer PRIMARY KEY, name text NOT NULL);" \
            -c "INSERT INTO pair.student VALUES (1, 'Ana'), (2, 'Ben');"
          echo "CMSC127_PAIR_DATABASE_URL=$pair_url" >> "$GITHUB_ENV"
      - name: Run the pair-only schema startup smoke
        run: npm run smoke:schema
      - name: Upload browser smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: harness-page-smoke-${{ runner.os }}-${{ github.run_id }}
          path: smoke-artifacts/
          if-no-files-found: warn
      - name: Run all Python tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\.venv\Scripts\python.exe -m unittest discover --start-directory tests --top-level-directory . --verbose
      - name: Run all Python tests
        if: runner.os == 'macOS'
        run: .venv/bin/python -m unittest discover --start-directory tests --top-level-directory . --verbose
      - name: Stop PostgreSQL on Windows
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP 't12-pg'
          if (Test-Path (Join-Path $data 'postmaster.pid')) {
            & "$env:PG_BIN\pg_ctl.exe" -D $data -m fast -w stop
          }
      - name: Stop PostgreSQL on macOS
        if: always() && runner.os == 'macOS'
        run: |
          if [ -f "$RUNNER_TEMP/t12-pg/postmaster.pid" ]; then
            pg_ctl -D "$RUNNER_TEMP/t12-pg" -m fast -w stop
          fi
