name: Tests

on:
  push:
    branches: [t04, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 55435:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CMSC127_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55435/postgres
      PGHOST: 127.0.0.1
      PGPORT: 55435
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: 3.15.2
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r requirements.txt
      - run: npm install --global pyright@1.1.414
      - run: pyright
      - run: .venv/bin/python -m unittest discover --start-directory tests --top-level-directory . --verbose

  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CMSC127_DATABASE_URL: postgresql://postgres@127.0.0.1:55435/postgres
      PGHOST: 127.0.0.1
      PGPORT: 55435
      PGUSER: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: 3.15.2
      - run: python -m venv .venv
      - name: Find PostgreSQL tools on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pgBin = $env:PGBIN
          if (-not $pgBin -or -not (Test-Path (Join-Path $pgBin 'initdb.exe'))) {
            $install = Get-ChildItem 'C:\Program Files\PostgreSQL' -Directory |
              Sort-Object Name -Descending |
              Select-Object -First 1
            if ($install) {
              $pgBin = Join-Path $install.FullName 'bin'
            }
          }
          if (-not $pgBin -or -not (Test-Path (Join-Path $pgBin 'initdb.exe'))) {
            $initdb = Get-Command initdb.exe -ErrorAction Stop
            $pgBin = Split-Path $initdb.Source
          }
          "PG_BIN=$pgBin" >> $env:GITHUB_ENV
          $pgBin >> $env:GITHUB_PATH
      - name: Install PostgreSQL on macOS
        if: runner.os == 'macOS'
        run: |
          brew install postgresql@18
          echo "$(brew --prefix postgresql@18)/bin" >> "$GITHUB_PATH"
      - name: Start PostgreSQL on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP 't04-pg'
          & "$env:PG_BIN\initdb.exe" -D $data -U postgres -A trust
          & "$env:PG_BIN\pg_ctl.exe" -D $data -l (Join-Path $env:RUNNER_TEMP 't04-pg.log') -o '-h 127.0.0.1 -p 55435' -w start
      - name: Start PostgreSQL on macOS
        if: runner.os == 'macOS'
        run: |
          initdb -D "$RUNNER_TEMP/t04-pg" -U postgres -A trust
          pg_ctl -D "$RUNNER_TEMP/t04-pg" -l "$RUNNER_TEMP/t04-pg.log" -o '-h 127.0.0.1 -p 55435' -w start
      - name: Install Python dependencies on Windows
        if: runner.os == 'Windows'
        run: .\.venv\Scripts\python.exe -m pip install -r requirements.txt
      - name: Install Python dependencies on Unix
        if: runner.os != 'Windows'
        run: .venv/bin/python -m pip install -r requirements.txt
      - run: npm install --global pyright@1.1.414
      - run: pyright
      - name: Run tests on Windows
        if: runner.os == 'Windows'
        run: .\.venv\Scripts\python.exe -m unittest discover --start-directory tests --top-level-directory . --verbose
      - name: Run tests on Unix
        if: runner.os != 'Windows'
        run: .venv/bin/python -m unittest discover --start-directory tests --top-level-directory . --verbose
      - name: Stop PostgreSQL on Windows
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP 't04-pg'
          if (Test-Path (Join-Path $data 'postmaster.pid')) {
            & "$env:PG_BIN\pg_ctl.exe" -D $data -m fast -w stop
          }
      - name: Stop PostgreSQL on macOS
        if: always() && runner.os == 'macOS'
        run: |
          if [ -f "$RUNNER_TEMP/t04-pg/postmaster.pid" ]; then
            pg_ctl -D "$RUNNER_TEMP/t04-pg" -m fast -w stop
          fi
